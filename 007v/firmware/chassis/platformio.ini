; 机械狗007v 底盘 ESP32-S3 固件
; 编译：  python -m platformio run -d 007v/firmware/chassis
; 烧录：  python -m platformio run -d 007v/firmware/chassis -t upload    （USB 线插板子上标 USB 的那个口）
; 改了 Python 底盘程序的常数以后，先跑一次 python 007v/firmware/chassis/gen_params.py

[env:chassis]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1      ; 串口走板子自带的 USB（和大脑之间那根线）
    -DARDUINO_USB_MODE=1
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    pololu/VL53L1X@1.3.1
    adafruit/Adafruit NeoPixel@1.12.3
